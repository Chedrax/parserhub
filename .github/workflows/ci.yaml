name: CI

on:
  push:

  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend checks

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parserhub
          POSTGRES_PASSWORD: parserhub
          POSTGRES_DB: parserhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parserhub -d parserhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://parserhub:parserhub@localhost:5432/parserhub
      SECRET_KEY: test-secret-key
      ENVIRONMENT: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: backend
        run: uv run mypy .

      - name: Run tests
        working-directory: backend
        run: uv run pytest
