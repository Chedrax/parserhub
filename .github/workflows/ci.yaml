name: CI

on:
  push:

  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    name: Backend checks

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Run Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Check formatting
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: backend
        run: uv run mypy .

      - name: Run tests
        working-directory: backend
        run: uv run pytest
