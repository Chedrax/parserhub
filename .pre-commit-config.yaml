repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run --directory backend ruff check
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: Ruff format
        entry: uv run --directory backend ruff format --check
        language: system
        types: [python]
        pass_filenames: false

      - id: commit-message
        name: Validate commit message
        entry: uv run --project backend python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
